<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register | EventHub India</title>

<link rel="stylesheet" href="register.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<header>
    <nav class="navbar">
        <h2>🎉 EventHub India</h2>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="events.html" class="active">Events</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
</header>

<section class="register-section">

<div class="register-box">

<h1>Festival Registration</h1>

<form id="registerForm">

<input type="text" id="name" placeholder="Full Name">

<input type="email" id="email" placeholder="Email Address">

<input type="tel" id="phone" placeholder="Mobile Number">

<input type="number" id="age" placeholder="Age">

<select id="gender">
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>

<input type="text" id="city" placeholder="City">

<input type="text" id="state" placeholder="State">

<select id="event">
<option value="">Choose Festival</option>
<option>Holi Celebration</option>
<option>Navratri Garba</option>
<option>Diwali Festival</option>
<option>Ganesh Chaturthi</option>
<option>Durga Puja</option>
<option>Onam</option>
<option>Makar Sankranti</option>
</select>

<input type="number" id="participants" placeholder="Number of Participants">

<select id="payment">
<option value="">Payment Method</option>
<option>UPI</option>
<option>Credit Card</option>
<option>Debit Card</option>
<option>Cash</option>
</select>

<label class="check">
<input type="checkbox" id="terms">
I agree to the Terms & Conditions
</label>

<button type="submit">Register Now</button>

<button type="reset" class="reset">Reset</button>

</form>

</div>

</section>

<script src="register.js"></script>

</body>
</html>
